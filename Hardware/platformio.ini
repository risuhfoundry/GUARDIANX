; GUARDIAN X — Gate Controller
;
; Two firmware images share this project. Each environment compiles only one
; of the source files, so you never have to move or rename files:
;
;   pio run -e verify -t upload    -> src/main.cpp   (gate verification mode)
;   pio run -e enroll -t upload    -> src/enroll.cpp (parent enrollment mode)

[platformio]
default_envs = verify

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps = 
    bblanchon/ArduinoJson@^7.0.4
    olikraus/U8g2

[env:verify]
build_src_filter = +<*> -<enroll.cpp>
; Injected as DEVICE_API_KEY. Leave unset in Git; set locally before upload:
;   PowerShell:  $env:GUARDIANX_DEVICE_API_KEY="..."
;   cmd:         set GUARDIANX_DEVICE_API_KEY=...
build_flags =
    '-DDEVICE_API_KEY="${sysenv.GUARDIANX_DEVICE_API_KEY}"'

[env:enroll]
build_src_filter = +<*> -<main.cpp>